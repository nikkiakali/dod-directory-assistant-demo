<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DoD Directory Assistant</title>

    <script src="https://www.gstatic.com/vertex-ai-search/gen-app-builder/client.js?hl=en_US"></script>


    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 0 16px;
      }
      #searchWidgetTrigger {
        width: 100%;
        padding: 14px;
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <h2>DoD Directory Assistant</h2>
    <p>Type a question and press Enter.</p>

    <gen-search-widget
      configId="00b9e858-ff28-4fcc-af2d-49d2ea0278dc"
      triggerId="searchWidgetTrigger">
    </gen-search-widget>

    <input
      id="searchWidgetTrigger"
      placeholder="Ask about DoD personnel, roles, orgs…" />

    <script>
      const t = document.getElementById("searchWidgetTrigger");
      t.addEventListener("keydown", (e) => {
        if (e.key === "Enter") t.click();
      });
    </script>
  </body>
</html>
